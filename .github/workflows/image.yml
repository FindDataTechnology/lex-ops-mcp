# lex-ops-mcp image — hk only (the ccr side is backfilled by the tcr-relay service; direct ccr push is disabled).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: lex-ops-mcp
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest tests/ -q

  lex-ops-mcp:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: lex-ops-mcp
      namespace: finddata-business
